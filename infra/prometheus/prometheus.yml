global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: minio
    metrics_path: /minio/metrics/v3
    static_configs:
      - targets: ["minio:9000"]

  - job_name: airflow-statsd
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://minio:9000/minio/health/ready
          - http://trino:8080/v1/info
          - http://airflow-api-server:8080/api/v2/monitor/health
          - http://prometheus:9090/-/healthy
          - http://grafana:3000/api/health
        labels:
          service: http
      - targets:
          - hive-postgres:5432
          - airflow-postgres:5432
          - hive-metastore:9083
        labels:
          service: tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [service]
        target_label: __param_module
        regex: tcp
        replacement: tcp_connect
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [service]
        target_label: probe_type
